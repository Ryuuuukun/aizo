spring.application.name=aizo

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8070/realms/aizo
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/aizo/protocol/openid-connect/certs

spring.datasource.url=jdbc:h2:mem:aizodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console